# CI workflow revision: verify current private Android source and preserve sufficient time for full TCG instrumentation.
# Instrumentation assertion policy: verify durable UI/data outcomes, not transient confirmation banners.
# Source update: verify family profiles, nutrition, kitchen recipes, and the new activity/water/sleep logging module.
name: Private Android source verification

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit SHA in zigzag4you/wellness-platform-dev"
        required: true
        default: "main"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-android-ci.yml"

permissions:
  contents: read

concurrency:
  group: private-android-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test private Android source
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Validate private repository read token
        shell: bash
        env:
          PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_REPO_READ_TOKEN" ]]; then
            echo "::error::Add PRIVATE_REPO_READ_TOKEN in this public repository's Actions secrets."
            exit 1
          fi

      - name: Checkout private source (read-only token)
        uses: actions/checkout@v4
        with:
          repository: zigzag4you/wellness-platform-dev
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false

      - name: Record exact source revision
        id: source
        working-directory: private-source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "## Private source revision"
            echo "$(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle caching and wrapper validation
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper integrity and initialize pinned distribution
        working-directory: private-source
        shell: bash
        run: |
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check -
          ./gradlew --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run Kotlin unit tests
        working-directory: private-source
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        working-directory: private-source
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK (not published or uploaded)
        working-directory: private-source
        run: ./gradlew --no-daemon :app:assembleDebug

      # TCG is explicitly enabled for GitHub-hosted runners without KVM.
      - name: Run Android emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: private-source
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Verification"
            echo "- Private repository: zigzag4you/wellness-platform-dev"
            echo "- Source ref requested: ${{ inputs.source_ref || 'main' }}"
            echo "- Source SHA: ${{ steps.source.outputs.sha }}"
            echo "- Gradle wrapper JAR SHA-256: verified"
            echo "- Gradle distribution: pinned 8.13 with SHA-256 validation"
            echo "- APKs and source files are not uploaded to this public repository."
          } >> "$GITHUB_STEP_SUMMARY"
